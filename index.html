<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Shelf</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #202020;
      --muted: #767676;
      --line: #e8e8e5;
      --accent: #2cb696;
      --accent-dark: #24987f;
      --danger: #d95c5c;
      --shadow: 0 12px 34px rgba(0,0,0,.06);
      --radius: 16px;
      --content-width: 1080px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      background: rgba(255,255,255,.88);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(100% - 32px, var(--content-width));
      margin: 0 auto;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.28), transparent 45%),
        var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .brand-text {
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      transition: .18s ease;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      background: #f3f3f1;
    }

    .btn-danger {
      background: #fff;
      color: var(--danger);
      border: 1px solid #f0d8d8;
    }

    .main {
      width: min(100% - 32px, var(--content-width));
      margin: 0 auto;
      padding: 40px 0 72px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -.04em;
      line-height: 1.08;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .empty {
      border: 1px dashed #d7d7d2;
      background: rgba(255,255,255,.6);
      border-radius: 20px;
      padding: 56px 24px;
      text-align: center;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .post-card {
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
      transition: .2s ease;
    }

    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .thumb-button {
      appearance: none;
      border: 0;
      padding: 0;
      width: 100%;
      display: block;
      background: #eaeae7;
      aspect-ratio: 1280 / 670;
      overflow: hidden;
    }

    .thumb-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .post-card:hover .thumb-button img {
      transform: scale(1.02);
    }

    .card-body {
      padding: 18px 18px 20px;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }

    .card-meta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .article-view {
      max-width: 860px;
      margin: 0 auto;
    }

    .article-head {
      margin-bottom: 28px;
    }

    .article-head h1 {
      margin: 16px 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.2;
      letter-spacing: -.04em;
    }

    .article-meta {
      color: var(--muted);
      font-size: 14px;
    }

    .article-thumb {
      width: 100%;
      aspect-ratio: 1280 / 670;
      background: #eaeae7;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin: 28px 0 36px;
    }

    .article-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .article-body {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(24px, 4vw, 44px);
      font-size: 17px;
      line-height: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .article-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .article-bottom-back {
      width: 100%;
      margin-top: 28px;
    }

    .editor {
      max-width: 860px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: clamp(22px, 4vw, 38px);
      box-shadow: var(--shadow);
    }

    .editor h1 {
      margin: 0 0 28px;
      font-size: 30px;
      letter-spacing: -.03em;
    }

    .field {
      margin-bottom: 24px;
    }

    .field label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid #deded9;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 14px 16px;
      outline: none;
      transition: .18s ease;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(44,182,150,.11);
    }

    .input {
      font-size: 18px;
      font-weight: 700;
    }

    .textarea {
      min-height: 320px;
      resize: vertical;
      line-height: 1.85;
    }

    .dropzone {
      position: relative;
      border: 1px dashed #cfcfc8;
      border-radius: 16px;
      overflow: hidden;
      background: #fafaf8;
      aspect-ratio: 1280 / 670;
      display: grid;
      place-items: center;
    }

    .dropzone.has-image {
      border-style: solid;
    }

    .dropzone img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .dropzone.has-image img {
      display: block;
    }

    .dropzone-label {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      color: var(--muted);
      line-height: 1.7;
    }

    .dropzone.has-image .dropzone-label {
      opacity: 0;
    }

    .dropzone:hover .dropzone-label {
      opacity: 1;
    }

    .dropzone.has-image:hover .dropzone-label {
      background: rgba(0,0,0,.55);
      color: #fff;
      border-radius: 999px;
      padding: 10px 16px;
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 3;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.7;
    }

    .editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 6px;
    }

    .back-link {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .back-link:hover {
      color: var(--text);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      background: rgba(25,25,25,.92);
      color: #fff;
      padding: 11px 16px;
      border-radius: 999px;
      font-size: 14px;
      transition: .22s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .main { width: min(100% - 20px, var(--content-width)); padding-top: 24px; }
      .topbar-inner { width: min(100% - 20px, var(--content-width)); }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .hero { align-items: flex-start; flex-direction: column; }
      .hero .btn { width: 100%; }
      .article-body { border-radius: 14px; }
      .editor { border-radius: 14px; padding: 20px; }
    }


    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
    }

    .tools-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(360px, calc(100vw - 24px));
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 48px rgba(0,0,0,.14);
      display: none;
      z-index: 80;
    }

    .tools-menu.open { display: block; }

    .menu-section + .menu-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .menu-label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    .menu-search-row {
      display: flex;
      gap: 8px;
    }

    .menu-search-row .input {
      min-width: 0;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .menu-search-row .btn {
      flex: 0 0 auto;
      padding: 9px 12px;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .calendar-title {
      font-weight: 800;
      font-size: 14px;
    }

    .calendar-nav {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 9px;
      padding: 0;
      font-weight: 800;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-weekday {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 0;
    }

    .calendar-day,
    .calendar-blank {
      aspect-ratio: 1;
      min-width: 0;
    }

    .calendar-day {
      position: relative;
      border: 0;
      border-radius: 9px;
      background: transparent;
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 12px;
      color: var(--text);
    }

    .calendar-day:hover { background: #f1f1ee; }

    .calendar-day.has-post::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .calendar-day.selected {
      background: var(--accent);
      color: #fff;
      font-weight: 800;
    }

    .calendar-day.selected::after { background: #fff; }

    .calendar-day.today:not(.selected) {
      box-shadow: inset 0 0 0 1px var(--accent);
      font-weight: 800;
    }

    .menu-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .menu-actions .btn,
    .menu-actions .import-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      margin: -10px 0 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .filter-status .btn {
      padding: 6px 10px;
      font-size: 12px;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 620px) {
      .top-actions > #newPostBtn { padding: 9px 12px; }
      .tools-menu { right: -2px; }
    }

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" role="button" tabindex="0" id="brandHome" aria-label="ホームへ戻る">
          <div class="brand-mark">S</div>
          <div class="brand-text">Story Shelf</div>
        </div>
        <div class="top-actions">
          <button class="btn btn-primary" id="newPostBtn">＋ 記事を書く</button>
          <button class="btn btn-ghost menu-btn" id="toolsMenuBtn" aria-label="検索・カレンダー・バックアップ" aria-expanded="false">☰</button>
          <div class="tools-menu" id="toolsMenu" aria-hidden="true">
            <div class="menu-section">
              <label class="menu-label" for="menuSearchInput">記事を検索</label>
              <div class="menu-search-row">
                <input class="input" id="menuSearchInput" type="search" placeholder="タイトル・本文を検索">
                <button class="btn btn-ghost" id="clearSearchBtn" type="button">クリア</button>
              </div>
            </div>
            <div class="menu-section">
              <span class="menu-label">カレンダーから検索</span>
              <div class="calendar-head">
                <button class="calendar-nav" id="prevMonthBtn" type="button" aria-label="前の月">‹</button>
                <div class="calendar-title" id="calendarTitle"></div>
                <button class="calendar-nav" id="nextMonthBtn" type="button" aria-label="次の月">›</button>
              </div>
              <div class="calendar-grid" id="calendarGrid"></div>
            </div>
            <div class="menu-section menu-actions">
              <button class="btn btn-ghost" id="backupBtn" type="button">JSON保存</button>
              <label class="btn btn-ghost import-label" for="restoreInput">JSON復元</label>
              <input class="visually-hidden" id="restoreInput" type="file" accept="application/json,.json">
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="main" id="app"></main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "storyShelfPostsV1";
    const BACKUP_VERSION = 1;

    const app = document.getElementById("app");
    const newPostBtn = document.getElementById("newPostBtn");
    const brandHome = document.getElementById("brandHome");
    const toast = document.getElementById("toast");
    const toolsMenuBtn = document.getElementById("toolsMenuBtn");
    const toolsMenu = document.getElementById("toolsMenu");
    const menuSearchInput = document.getElementById("menuSearchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const calendarTitle = document.getElementById("calendarTitle");
    const calendarGrid = document.getElementById("calendarGrid");

    let posts = loadPosts();
    let currentView = "home";
    let currentPostId = null;
    let homeScrollY = 0;
    let homeSearch = "";
    let homeDate = "";
    let calendarCursor = new Date();
    calendarCursor.setDate(1);

    function loadPosts() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {}

      return [
        {
          id: newId(),
          title: "最初の記事",
          body: "ここに本文が表示されます。\n\n右上の「記事を書く」から、新しい記事を作成できます。\nサムネイルをクリックすると、この記事ページに移動します。",
          image: makePlaceholder("最初の記事"),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        }
      ];
    }

    function savePosts(nextPosts = posts) {
      // localStorage への保存が成功してから、画面上の posts を差し替える。
      // これにより、保存失敗時に「キャンセルすると更新済みに見える」状態を防ぐ。
      localStorage.setItem(STORAGE_KEY, JSON.stringify(nextPosts));
      posts = nextPosts;
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("画像を読み込めませんでした"));
        reader.readAsDataURL(file);
      });
    }

    async function optimizeImage(file) {
      // SVG はそのまま保持。それ以外は縮小・圧縮して localStorage の容量超過を起こしにくくする。
      if (file.type === "image/svg+xml") return fileToDataURL(file);

      const source = await fileToDataURL(file);
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error("画像を読み込めませんでした"));
        img.src = source;
      });

      const MAX_SIDE = 1600;
      const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const width = Math.max(1, Math.round(img.naturalWidth * scale));
      const height = Math.max(1, Math.round(img.naturalHeight * scale));

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      if (!ctx) return source;
      ctx.drawImage(img, 0, 0, width, height);

      // WebP で軽量化。非対応環境では元画像へフォールバック。
      const optimized = canvas.toDataURL("image/webp", 0.78);
      return optimized && optimized.startsWith("data:image/") ? optimized : source;
    }

    function makePlaceholder(text = "Thumbnail") {
      const safe = String(text).replace(/[<>&'\"]/g, "");
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#dff8f1"/>
              <stop offset="100%" stop-color="#9be3d1"/>
            </linearGradient>
          </defs>
          <rect width="1280" height="670" fill="url(#g)"/>
          <circle cx="1090" cy="120" r="220" fill="rgba(255,255,255,.28)"/>
          <circle cx="210" cy="585" r="260" fill="rgba(255,255,255,.18)"/>
          <text x="90" y="350" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#1d5f50">${safe.slice(0, 20)}</text>
          <text x="92" y="420" font-family="Arial, sans-serif" font-size="28" fill="#367a6c">1280 × 670 thumbnail</text>
        </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[ch]));
    }

    function newId() {
      return (crypto.randomUUID && crypto.randomUUID()) || `id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function safeIso(value, fallback = new Date().toISOString()) {
      const t = Date.parse(value);
      return Number.isNaN(t) ? fallback : new Date(t).toISOString();
    }

    function formatDate(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(date);
    }

    function toLocalDateKey(iso) {
      const date = new Date(iso);
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function showToast(message, duration = 2200) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), duration);
    }


    function closeToolsMenu() {
      toolsMenu.classList.remove("open");
      toolsMenu.setAttribute("aria-hidden", "true");
      toolsMenuBtn.setAttribute("aria-expanded", "false");
    }

    function syncMenuControls() {
      menuSearchInput.value = homeSearch;
      clearSearchBtn.disabled = !homeSearch && !homeDate;
      renderCalendar();
    }

    function renderCalendar() {
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();
      calendarTitle.textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayKey = toLocalDateKey(new Date().toISOString());
      const postDates = new Set(posts.map(post => toLocalDateKey(post.updatedAt || post.createdAt)));
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

      let html = weekdays.map(day => `<div class="calendar-weekday">${day}</div>`).join("");
      html += '<div class="calendar-blank"></div>'.repeat(firstDay);

      for (let day = 1; day <= daysInMonth; day++) {
        const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const classes = ["calendar-day"];
        if (postDates.has(key)) classes.push("has-post");
        if (homeDate === key) classes.push("selected");
        if (todayKey === key) classes.push("today");
        html += `<button class="${classes.join(" ")}" type="button" data-calendar-date="${key}" aria-label="${year}年${month + 1}月${day}日">${day}</button>`;
      }

      calendarGrid.innerHTML = html;
      calendarGrid.querySelectorAll("[data-calendar-date]").forEach(button => {
        button.addEventListener("click", () => {
          homeDate = homeDate === button.dataset.calendarDate ? "" : button.dataset.calendarDate;
          homeScrollY = 0;
          syncMenuControls();
          if (currentView === "home") renderHome();
          else goHome();
        });
      });
    }

    function applySearchFromMenu() {
      homeSearch = menuSearchInput.value;
      homeScrollY = 0;
      clearSearchBtn.disabled = !homeSearch && !homeDate;
      if (currentView === "home") renderHome();
      else goHome();
    }

    function getFilteredPosts() {
      const keyword = homeSearch.trim().toLocaleLowerCase("ja");
      return posts
        .filter(post => {
          const matchesKeyword = !keyword || `${post.title}\n${post.body}`.toLocaleLowerCase("ja").includes(keyword);
          const matchesDate = !homeDate || toLocalDateKey(post.updatedAt || post.createdAt) === homeDate;
          return matchesKeyword && matchesDate;
        })
        .slice()
        .sort((a, b) => (Date.parse(b.updatedAt) || 0) - (Date.parse(a.updatedAt) || 0));
    }

    function goHome({ restoreScroll = false } = {}) {
      currentView = "home";
      currentPostId = null;
      renderHome({ restoreScroll });
    }

    function renderHome({ restoreScroll = false } = {}) {
      currentView = "home";
      const filteredPosts = getFilteredPosts();

      const cards = filteredPosts.map(post => `
        <article class="post-card" data-post-card="${post.id}">
          <button class="thumb-button" data-open="${post.id}" aria-label="${escapeHTML(post.title)}を開く">
            <img src="${escapeHTML(post.image || makePlaceholder(post.title))}" alt="${escapeHTML(post.title)}のサムネイル">
          </button>
          <div class="card-body">
            <h2 class="card-title">${escapeHTML(post.title)}</h2>
            <div class="card-meta">${formatDate(post.updatedAt)}</div>
          </div>
        </article>
      `).join("");

      const resultText = (homeSearch || homeDate)
        ? `${filteredPosts.length}件見つかりました`
        : `${posts.length}件の記事`;

      app.innerHTML = `
        <section class="hero">
          <div>
            <h1>あなたの記事</h1>
            <p>サムネイルをクリックすると本文を読めます。</p>
          </div>
          <button class="btn btn-primary" id="heroNewBtn">記事を書く</button>
        </section>

        ${(homeSearch || homeDate) ? `
          <div class="filter-status">
            <span>${resultText}${homeSearch ? ` ・「${escapeHTML(homeSearch)}」` : ""}${homeDate ? ` ・ ${escapeHTML(homeDate)}` : ""}</span>
            <button class="btn btn-ghost" id="clearFiltersBtn">絞り込み解除</button>
          </div>
        ` : ""}

        ${filteredPosts.length
          ? `<section class="grid">${cards}</section>`
          : posts.length
            ? `<section class="empty"><p>検索条件に一致する記事がありません。</p></section>`
            : `<section class="empty">
                 <p>まだ記事がありません。</p>
                 <button class="btn btn-primary" id="emptyNewBtn">最初の記事を書く</button>
               </section>`
        }
      `;

      document.querySelectorAll("[data-open]").forEach(btn => {
        btn.addEventListener("click", () => {
          homeScrollY = window.scrollY;
          renderArticle(btn.dataset.open);
        });
      });

      document.getElementById("heroNewBtn")?.addEventListener("click", () => renderEditor());
      document.getElementById("emptyNewBtn")?.addEventListener("click", () => renderEditor());

      document.getElementById("clearFiltersBtn")?.addEventListener("click", () => {
        homeSearch = "";
        homeDate = "";
        homeScrollY = 0;
        syncMenuControls();
        renderHome();
      });

      syncMenuControls();

      requestAnimationFrame(() => {
        if (restoreScroll) {
          window.scrollTo({ top: homeScrollY, behavior: "auto" });
        } else if (!homeSearch && !homeDate && homeScrollY === 0) {
          window.scrollTo({ top: 0, behavior: "auto" });
        }
      });
    }

    function renderArticle(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return goHome({ restoreScroll: true });

      currentView = "article";
      currentPostId = id;

      app.innerHTML = `
        <article class="article-view">
          <button class="back-link" id="backHome">← 記事一覧へ</button>

          <header class="article-head">
            <h1>${escapeHTML(post.title)}</h1>
            <div class="article-meta">更新日 ${formatDate(post.updatedAt)}</div>
          </header>

          <div class="article-thumb">
            <img src="${escapeHTML(post.image || makePlaceholder(post.title))}" alt="${escapeHTML(post.title)}のサムネイル">
          </div>

          <div class="article-body">${escapeHTML(post.body)}</div>

          <div class="article-actions">
            <button class="btn btn-primary" id="editBtn">編集する</button>
            <button class="btn btn-danger" id="deleteBtn">削除する</button>
          </div>

          <button class="btn btn-ghost article-bottom-back" id="backHomeBottom">← 記事一覧へ戻る</button>
        </article>
      `;

      document.getElementById("backHome").addEventListener("click", () => goHome({ restoreScroll: true }));
      document.getElementById("backHomeBottom").addEventListener("click", () => goHome({ restoreScroll: true }));
      document.getElementById("editBtn").addEventListener("click", () => renderEditor(id));
      document.getElementById("deleteBtn").addEventListener("click", () => {
        if (!confirm("この記事を削除しますか？")) return;
        posts = posts.filter(p => p.id !== id);
        savePosts();
        showToast("記事を削除しました");
        goHome({ restoreScroll: true });
      });

      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function renderEditor(id = null) {
      const editing = id ? posts.find(p => p.id === id) : null;
      currentView = "editor";
      currentPostId = id;

      app.innerHTML = `
        <section class="editor">
          <h1>${editing ? "記事を編集" : "新しい記事"}</h1>

          <div class="field">
            <label for="titleInput">タイトル</label>
            <input
              class="input"
              id="titleInput"
              type="text"
              maxlength="120"
              placeholder="タイトルを入力"
              value="${editing ? escapeHTML(editing.title) : ""}"
            />
          </div>

          <div class="field">
            <label>サムネイル</label>
            <div class="dropzone ${editing?.image ? "has-image" : ""}" id="dropzone">
              <img id="thumbPreview" src="${escapeHTML(editing?.image || "")}" alt="">
              <div class="dropzone-label">
                <strong>画像を選択</strong><br>
                1280 × 670 px 推奨
              </div>
              <input id="imageInput" type="file" accept="image/*">
            </div>
            <div class="hint">
              表示領域は1280 × 670 pxと同じ比率です。異なる比率の画像は中央を基準にトリミング表示されます。
            </div>
          </div>

          <div class="field">
            <label for="bodyInput">本文</label>
            <textarea
              class="textarea"
              id="bodyInput"
              placeholder="本文を書いてください"
            >${editing ? escapeHTML(editing.body) : ""}</textarea>
          </div>

          <div class="editor-actions">
            <button class="btn btn-ghost" id="cancelBtn">キャンセル</button>
            <button class="btn btn-primary" id="saveBtn">${editing ? "更新する" : "公開する"}</button>
          </div>
        </section>
      `;

      const titleInput = document.getElementById("titleInput");
      const bodyInput = document.getElementById("bodyInput");
      const imageInput = document.getElementById("imageInput");
      const preview = document.getElementById("thumbPreview");
      const dropzone = document.getElementById("dropzone");
      const saveBtn = document.getElementById("saveBtn");

      let imageData = editing?.image || "";
      let isSaving = false;

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files?.[0];
        if (!file) return;

        imageInput.disabled = true;
        showToast("画像を読み込んでいます…", 1200);

        try {
          imageData = await optimizeImage(file);
          preview.src = imageData;
          dropzone.classList.add("has-image");
          showToast("画像を追加しました");
        } catch (error) {
          console.error(error);
          imageInput.value = "";
          showToast("画像の読み込みに失敗しました", 3200);
        } finally {
          imageInput.disabled = false;
        }
      });

      document.getElementById("cancelBtn").addEventListener("click", () => {
        editing ? renderArticle(editing.id) : goHome({ restoreScroll: true });
      });

      saveBtn.addEventListener("click", () => {
        if (isSaving) return;

        const title = titleInput.value.trim();
        const body = bodyInput.value.trim();

        if (!title) {
          titleInput.focus();
          showToast("タイトルを入力してください");
          return;
        }

        if (!body) {
          bodyInput.focus();
          showToast("本文を入力してください");
          return;
        }

        isSaving = true;
        saveBtn.disabled = true;
        saveBtn.setAttribute("aria-busy", "true");
        saveBtn.textContent = editing ? "更新中…" : "投稿中…";

        let savedId = null;
        let savedMessage = "";

        try {
          // ここでは「保存」だけを try/catch で囲む。描画の失敗を保存失敗と誤認しないため。
          const now = new Date().toISOString();

          if (editing) {
            const updatedPost = {
              ...editing,
              title,
              body,
              image: imageData || makePlaceholder(title),
              updatedAt: now
            };
            savePosts(posts.map(post => post.id === editing.id ? updatedPost : post));
            savedId = editing.id;
            savedMessage = "記事を更新しました";
          } else {
            const newPost = {
              id: newId(),
              title,
              body,
              image: imageData || makePlaceholder(title),
              createdAt: now,
              updatedAt: now
            };
            savePosts([...posts, newPost]);
            savedId = newPost.id;
            savedMessage = "投稿しました";
          }
        } catch (error) {
          console.error(error);
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.removeAttribute("aria-busy");
          saveBtn.textContent = editing ? "更新する" : "公開する";
          const isQuotaError = error?.name === "QuotaExceededError" || error?.name === "NS_ERROR_DOM_QUOTA_REACHED";
          showToast(
            isQuotaError
              ? "保存容量がいっぱいです。JSONバックアップ後、不要な記事や大きな画像を整理してください"
              : "保存に失敗しました。もう一度お試しください",
            4200
          );
          return;
        }

        // 保存成功後の描画。ここで例外が出ても「保存失敗」とは表示しない。
        showToast(savedMessage);
        try {
          renderArticle(savedId);
        } catch (error) {
          console.error("render error after save:", error);
          try { goHome(); } catch (e) { console.error(e); }
        }
      });

      window.scrollTo({ top: 0, behavior: "auto" });
      setTimeout(() => titleInput.focus(), 0);
    }

    function exportBackup() {
      const backup = {
        app: "Story Shelf",
        version: BACKUP_VERSION,
        exportedAt: new Date().toISOString(),
        posts
      };

      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const stamp = toLocalDateKey(new Date().toISOString()).replaceAll("-", "");
      link.href = url;
      link.download = `story-shelf-backup-${stamp}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("JSONバックアップを保存しました");
    }

    function isValidPost(post) {
      return post &&
        typeof post === "object" &&
        typeof post.title === "string" &&
        typeof post.body === "string" &&
        typeof post.createdAt === "string" &&
        typeof post.updatedAt === "string";
    }

    function normalizeImportedPost(post) {
      const createdAt = safeIso(post.createdAt);
      return {
        id: typeof post.id === "string" && post.id ? post.id : newId(),
        title: post.title,
        body: post.body,
        image: typeof post.image === "string" && post.image ? post.image : makePlaceholder(post.title),
        createdAt,
        updatedAt: safeIso(post.updatedAt, createdAt)
      };
    }

    function importBackup(event) {
      const input = event.currentTarget;
      const file = input.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const importedPosts = Array.isArray(data) ? data : data?.posts;

          if (!Array.isArray(importedPosts) || !importedPosts.every(isValidPost)) {
            throw new Error("Invalid backup format");
          }

          if (!confirm(`バックアップ内の${importedPosts.length}件の記事で、現在の記事を置き換えますか？`)) {
            input.value = "";
            return;
          }

          // 保存に成功してから posts を差し替える（失敗時は現状維持）
          savePosts(importedPosts.map(normalizeImportedPost));
        } catch (error) {
          console.error(error);
          const isQuotaError = error?.name === "QuotaExceededError" || error?.name === "NS_ERROR_DOM_QUOTA_REACHED";
          showToast(isQuotaError ? "保存容量が足りず復元できませんでした" : "このJSONファイルは復元できません", 3200);
          input.value = "";
          return;
        }

        input.value = "";
        showToast("バックアップから復元しました");
        try {
          homeSearch = "";
          homeDate = "";
          homeScrollY = 0;
          calendarCursor = new Date();
          calendarCursor.setDate(1);
          syncMenuControls();
          renderHome();
        } catch (error) {
          console.error("render error after import:", error);
        }
      };
      reader.readAsText(file, "utf-8");
    }


    toolsMenuBtn.addEventListener("click", event => {
      event.stopPropagation();
      const willOpen = !toolsMenu.classList.contains("open");
      if (willOpen) {
        syncMenuControls();
        toolsMenu.classList.add("open");
        toolsMenu.setAttribute("aria-hidden", "false");
        toolsMenuBtn.setAttribute("aria-expanded", "true");
      } else {
        closeToolsMenu();
      }
    });

    toolsMenu.addEventListener("click", event => event.stopPropagation());
    document.addEventListener("click", closeToolsMenu);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeToolsMenu();
    });

    menuSearchInput.addEventListener("input", applySearchFromMenu);
    clearSearchBtn.addEventListener("click", () => {
      homeSearch = "";
      homeDate = "";
      homeScrollY = 0;
      syncMenuControls();
      if (currentView === "home") renderHome();
      else goHome();
    });

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById("backupBtn").addEventListener("click", exportBackup);
    document.getElementById("restoreInput").addEventListener("change", importBackup);

    newPostBtn.addEventListener("click", () => renderEditor());

    brandHome.addEventListener("click", () => {
      homeScrollY = 0;
      goHome();
    });
    brandHome.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        homeScrollY = 0;
        goHome();
      }
    });

    syncMenuControls();
    renderHome();
  </script>
</body>
</html>
